version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: electio_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: electio_user
      POSTGRES_PASSWORD: electio_pass
      POSTGRES_DB: electio_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U electio_user -d electio_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: